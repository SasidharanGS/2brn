[project]
name = "brn-daemon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "chromadb>=1.5.9",
    "pytesseract>=0.3.13",
    "mss>=10.2.0",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "litellm>=1.96.2",
    "openai>=1.30",
    "keyring>=25.0",
    "cryptography>=42.0",
    "APScheduler>=3.10",
    "sse-starlette>=3.4.8",
    "numpy>=2.5.2",
    "python-dotenv>=1.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "pytest-cov>=4",
    "ruff>=0.16.3",
    "pyright>=1.1.411",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/brn_daemon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py runs load_dotenv() before imports (intentional) and wires the log
# buffer after basicConfig — E402 is expected in this file.
"src/brn_daemon/main.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
ignore = ["tests/"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["brn_daemon"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
