[project]
name = "brn-daemon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    "pytesseract>=0.3.13",
    "mss>=9.0",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "litellm>=1.40",
    "openai>=1.30",
    "keyring>=25.0",
    "cryptography>=42.0",
    "APScheduler>=3.10",
    "sse-starlette>=2.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/brn_daemon"]
