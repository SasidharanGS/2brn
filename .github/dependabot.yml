# Dependabot keeps dependencies up to date with weekly PRs.
# Docs: https://docs.github.com/code-security/dependabot
#
# Note: the daemon uses uv (pyproject.toml + uv.lock). If the "uv" ecosystem is
# ever unsupported for your runner, switch it to "pip".
version: 2
updates:
  # Python daemon (uv)
  - package-ecosystem: "uv"
    directory: "/daemon"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      daemon-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Electron / React UI (pnpm — read via the npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ui-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
