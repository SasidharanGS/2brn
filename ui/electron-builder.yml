appId: com.2brn.app
productName: 2brn
directories:
  output: release
  buildResources: build

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity

dmg:
  title: "2brn"

extraResources:
