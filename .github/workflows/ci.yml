name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  daemon:
    name: Daemon — lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: daemon

      - name: Ruff lint
        run: uv run ruff check src/
        working-directory: daemon

      - name: Pyright typecheck
        run: uv run pyright src/brn_daemon
        working-directory: daemon

      - name: Test
        working-directory: daemon
        run: uv run --extra dev pytest tests/ -q --timeout=30 --cov=brn_daemon --cov-fail-under=60 --cov-report=term-missing

  ui:
    name: UI — typecheck & build
    runs-on: ubuntu-latest
    env:
      # We only type-check and bundle here; no need to download the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Type-check
        run: pnpm exec tsc --noEmit
        working-directory: ui

      - name: Build
        run: pnpm build
        working-directory: ui
